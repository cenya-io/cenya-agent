<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--CSP-->
<title>Cenya Agent</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar">
    <div class="brand"><span id="brand-mark"></span><span class="brand-name">Cenya Agent<span class="brand-sub" id="brand-version"></span></span></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main class="main">
    <div id="banner"></div>
    <div class="scroller" id="scroller">
      <header class="page-head">
        <div><h1 class="page-title" id="title"></h1><p class="page-sub" id="subtitle"></p></div>
        <div class="page-actions" id="head-actions"></div>
      </header>
      <section id="content" class="content" tabindex="-1"></section>
    </div>
  </main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="overlay"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
